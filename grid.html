<!DOCTYPE html>
<html lang="en">
<head>

</head>
  <style>

    .cont{
        display: grid;
        grid-template-columns:  100px 100px 100px 100px;
          grid-gap: 20px;
    }

       .box{
          width: 100px;
          height: 100px;
          background-color: blanchedalmond;
          border: 2px solid black;
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 30px;
          font-weight: 900;
          border-radius:  150% 0 200% 0 ;
        

       }

       .box:hover{
             background-color: black;
             color: gold;

       }
  </style>
<body>

   <div  class="cont">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
      <div class="box">7</div>
      <div class="box">8</div>
      <div class="box">9</div>
      <div class="box">0</div>
      <div class="box">=</div>
      <div class="box">+</div>
      <div class="box">*</div>
      <div class="box">/</div>
      <div class="box">clear</div>
      <div class="box">%</div>
    
   </div>
  
</body>
</html>
