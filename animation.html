<style>

   img{
        animation-name:   travelWithBlinking;
        animation-duration: 1s;
        animation-iteration-count: 10;
   }
     

   
    @keyframes rotateZ
    {
        from{ transform: rotateZ(0deg) ;}
        to{  transform: rotateZ(360deg);}

    }

    @keyframes  blinking
    {
        from{ transform: scale(2);}
        to{  transform:  scale(0.3);}
    }

    @keyframes  moveRigth
    {
        from{ transform: translateZ(-350px);}
        to{transform: translateZ(350px);}
    }

    @keyframes skew
    {
        from { transform: skewZ(60deg);}
        to{ transform: skewZ(180deg);}
    }

    @keyframes travelWithBlinking
    {
        from {  transform: rotateZ(360deg)  scale(5)  ;  border: 10px solid black; }
        to{  transform: rotateZ(0deg)  scale(0.3)  ; border: 1px solid black}
    }


</style>
